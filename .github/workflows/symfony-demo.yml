name: Symfony SQLite — clean release
on:
  push:
    paths: ['apps/symfony/**', '.github/workflows/symfony-demo.yml', 'LIRE_AVANT_INSTALLATION.md', 'README.md', 'docs/**', 'CHARTER.md']
  pull_request:
    paths: ['apps/symfony/**', '.github/workflows/symfony-demo.yml', 'LIRE_AVANT_INSTALLATION.md', 'README.md', 'docs/**', 'CHARTER.md']
permissions:
  contents: read

jobs:
  native-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/symfony
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,openssl,tokenizer,mbstring,ctype,iconv,dom,xml,xmlwriter,simplexml,curl
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: test -f vendor/autoload.php
      - run: composer style:check
      - run: composer analyse
      - name: Create local secrets exclusively with PHP CLI (no installer)
        shell: bash
        run: |
          set -euo pipefail
          php -r '$p=".env.local";if(!file_exists($p)){$h=@fopen($p,"x");if(!$h){fwrite(STDERR,"Cannot create .env.local\n");exit(1);}chmod($p,0600);fwrite($h,"APP_SECRET=".bin2hex(random_bytes(32))."\nGUARDIAN_ENCRYPTION_KEY=".bin2hex(random_bytes(32))."\n");fclose($h);}'
      - run: php bin/console doctrine:migrations:migrate --no-interaction --env=demo
      - run: php bin/console app:geography:install --env=demo
      - run: php bin/console app:geography:install --check --env=demo
      - run: php bin/console app:demo:prepare --env=demo
      - run: php bin/console cache:clear --env=demo --no-debug
      - run: php bin/console lint:twig templates --env=demo
      - run: php bin/console lint:yaml config --parse-tags
      - run: php bin/console doctrine:schema:validate --env=demo
      - run: php bin/console app:geography:install --env=demo
      - run: php bin/console app:geography:install --check --env=demo
      - run: python3 tests/http_smoke.py
      - run: python3 tests/policy_catalog_import_test.py
      - run: python3 tests/senate_dossier_enrichment_test.py
      - run: composer test
      - run: python3 tests/decp_v2_evidence_test.py
      - run: python3 tests/decp_query_plan_test.py
      - run: python3 tests/decp_financial_evidence_test.py
      - run: python3 tests/decp_boamp_concordance_test.py
      - run: python3 tests/boamp_national_import_test.py
      - run: python3 tests/boamp_national_match_test.py
      - name: Verify official BOAMP JSONL export format with 1 bounded notice
        run: |
          python3 tools/import_boamp_national.py --download --probe --db /tmp/populorum-ci-boamp-probe.sqlite
          python3 tools/import_boamp_national.py --stats --db /tmp/populorum-ci-boamp-probe.sqlite
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from import_boamp_national import export_url,stream_from_url
          with stream_from_url(export_url('2026-11-12')) as response:
              data=response.readline()
          assert isinstance(json.loads(data),dict)
          print('BOAMP increment dateparution depuis 2026-11-12: JSONL accessible')
          PY
          python3 - <<'PY'
          import sqlite3,sys
          sys.path.insert(0,'tools')
          from match_boamp_national import process,source_ready,LOCAL_SCHEMA
          from reconcile_procurement_boamp import SCHEMA as LINK_SCHEMA
          with sqlite3.connect(':memory:') as decp, \
               sqlite3.connect('/tmp/populorum-ci-boamp-probe.sqlite') as boamp, \
               sqlite3.connect(':memory:') as side:
              for db in (decp,boamp,side):db.row_factory=sqlite3.Row
              decp.execute('CREATE TABLE contracts (contract_key TEXT, buyer_id TEXT, original_id TEXT, object TEXT, notice_date TEXT,cpv TEXT,kind TEXT)')
              decp.execute("INSERT INTO contracts VALUES(?,?,?,?,?,?,?)",
                ('a'*40,'21690264300016','24VRA0101',
                 'FOURNITURE DE PANNEAUX DE SIGNALISATION VERTICALE ET ACCESSOIRES',
                 '2089-03-13','34992200','market'))
              side.executescript(LINK_SCHEMA)
              side.executescript(LOCAL_SCHEMA)
              source_ready(boamp)
              result=process(decp,boamp,side,[dict(decp.execute('SELECT * FROM contracts').fetchone())])
              print('BOAMP official notice 24-30283 / test DECP synthetic link:',result)
              assert result['contracts']==1
              assert side.execute('SELECT COUNT(*) FROM local_checks').fetchone()[0]==1
          PY

      - name: Verify BOAMP API v2.1 schema with a real bounded query
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from reconcile_procurement_boamp import fetch_candidates, classify
          title='Fourniture de dispositifs médicaux implantables et dispositifs médicaux spécialisés 2025'
          data=fetch_candidates(title, 'AO25DMISP', '26380030200014')
          assert isinstance(data,list)
          contract={'contract_key':'a'*40,'buyer_id':'26380030200014',
                    'original_id':'AO25DMISP','object':title,'notice_date':'2025-05-20'}
          matches=[(x['idweb'],m['status']) for x in data if (m:=classify(contract,x)) is not None]
          print('BOAMP API ODSQL OK; filtres SIRET+objet :',len(data),'avis, liens candidats/confirmes :',matches)
          PY
      - run: python3 -m py_compile tools/import_decp.py tools/import_procurement_evidence.py tools/enrich_procurement_boamp.py tools/reconcile_procurement_boamp.py tools/audit_procurement_concordance.py tools/import_boamp_national.py tools/match_boamp_national.py
      - run: python3 tests/fresh_install_contract_test.py
      - run: python3 tests/decp_pipeline_test.py
      - run: python3 tests/decp_history_test.py
      - run: python3 tests/decp_sql_inputs_test.py
      - run: command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
      - run: python3 tests/decp_archive_test.py
      - run: python3 -m py_compile tools/import_ssmsi_national.py
  arch-install:
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        working-directory: apps/symfony
    steps:
      - name: Official Arch Linux packages
        working-directory: /
        run: pacman -Syu --noconfirm --needed php php-sqlite composer git python unzip zstd ca-certificates
      - uses: actions/checkout@v4
      - name: Enable modules supplied by Arch packages when necessary
        shell: bash
        run: |
          mkdir -p /etc/php/conf.d
          for ext in pdo_sqlite sqlite3 iconv mbstring dom simplexml xml curl; do
            if ! php -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' "$ext" && [[ -f "/usr/lib/php/modules/$ext.so" ]]; then
              printf 'extension=%s\n' "$ext" >> /etc/php/conf.d/populorum-ci.ini
            fi
          done
      - name: Install directly in terminal (no shell installer)
        shell: bash
        run: |
          set -euo pipefail
          php -r '$r=["openssl","pdo","pdo_sqlite","sqlite3","tokenizer","mbstring","iconv","dom","simplexml","curl","zlib"];foreach($r as $x){if(!extension_loaded($x)){fwrite(STDERR,"Extension PHP absente : $x\n");exit(1);}}'
          composer install --no-interaction --prefer-dist --no-progress
          test -f vendor/autoload.php
          php -r '$p=".env.local";if(!file_exists($p)){$h=@fopen($p,"x");if(!$h){fwrite(STDERR,"Cannot create .env.local\n");exit(1);}chmod($p,0600);fwrite($h,"APP_SECRET=".bin2hex(random_bytes(32))."\nGUARDIAN_ENCRYPTION_KEY=".bin2hex(random_bytes(32))."\n");fclose($h);}'
          php bin/console doctrine:migrations:migrate --no-interaction --env=demo
          php bin/console app:geography:install --env=demo
          php bin/console app:geography:install --check --env=demo
          php bin/console app:demo:prepare --env=demo
          php bin/console cache:clear --env=demo --no-debug
          php bin/console doctrine:schema:validate --env=demo
          php bin/console app:geography:install --env=demo
          php bin/console app:geography:install --check --env=demo
          python3 tests/http_smoke.py
          python3 tests/policy_catalog_import_test.py
          python3 tests/senate_dossier_enrichment_test.py
      - name: Install from freshly extracted clean repository archive
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d /tmp/populorum-clean-XXXXXX)"
          trap 'rm -rf "$temp"' EXIT
          git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar --prefix=Populorum-clean/ "$GITHUB_SHA" | tar -xf - -C "$temp"
          cd "$temp/Populorum-clean/apps/symfony"
          test ! -e vendor/autoload.php
          test ! -e .env.local
          test ! -e tools/install-arch.sh
          test ! -e tools/init-demo.php
          composer install --no-interaction --prefer-dist --no-progress
          test -f vendor/autoload.php
          php -r '$p=".env.local";if(!file_exists($p)){$h=@fopen($p,"x");if(!$h){fwrite(STDERR,"Cannot create .env.local\n");exit(1);}chmod($p,0600);fwrite($h,"APP_SECRET=".bin2hex(random_bytes(32))."\nGUARDIAN_ENCRYPTION_KEY=".bin2hex(random_bytes(32))."\n");fclose($h);}'
          php bin/console doctrine:migrations:migrate --no-interaction --env=demo
          php bin/console app:geography:install --env=demo
          php bin/console app:geography:install --check --env=demo
          php bin/console app:demo:prepare --env=demo
          php bin/console cache:clear --env=demo --no-debug
          php bin/console doctrine:schema:validate --env=demo
          php bin/console app:geography:install --env=demo
          php bin/console app:geography:install --check --env=demo
          python3 tests/http_smoke.py
      - name: Verify only maintained operational files are included in tools
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed = {'.gitignore','bootstrap.php','decp_archive.py','decp_index_health.py','decp_pipeline.py',
            'verify_decp_history.py','backfill_decp_history.py','import_decp.py','import_procurement_evidence.py','import_procurement_financial_evidence.py','enrich_procurement_boamp.py','reconcile_procurement_boamp.py','audit_procurement_concordance.py','import_boamp_national.py','match_boamp_national.py','import_budget_national.py',
            'import_codes_postaux.py','import_communes_insee.py',
            'recount.php','verify-export.php','import_ssmsi_national.py','import_policy_catalog.py','enrich_senate_dossiers.py'}
          present = {p.name for p in Path('tools').iterdir() if p.is_file()}
          assert present == allowed, f'Unexpected/absent tooling: extra={sorted(present-allowed)} missing={sorted(allowed-present)}'
          print('OK — clean tools inventory:', len(allowed) - 1)
          PY
      - name: Data archive regression
        run: |
          python3 tests/decp_archive_test.py
  release-installable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-demo, arch-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested clean sources (no historical tools, no private databases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.13.4-clean"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists, nothing replaced."
            exit 0
          fi
          mkdir -p release
          ARCHIVE="Populorum-${TAG}.tar.gz"
          PREFIX="Populorum-${TAG}/"
          git archive --format=tar --prefix="$PREFIX" "$GITHUB_SHA" | gzip -9 > "release/$ARCHIVE"
          test -s "release/$ARCHIVE"
          (cd release && sha256sum "$ARCHIVE" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          FIRST_ENTRY="$(tar -tzf "release/$ARCHIVE" | sed -n '1p')"
          [[ "$FIRST_ENTRY" == "$PREFIX"* ]] || { echo "Incorrect archive directory: $FIRST_ENTRY" >&2; exit 1; }
          if tar -tzf "release/$ARCHIVE" | grep -E '(^|/)(vendor/|\.env\.local$|policy-catalog\.sqlite$|\.guardian-shield/)' ; then
            echo "Archive contains private or built files" >&2
            exit 1
          fi
          gh release create "$TAG" "release/$ARCHIVE" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Populorum v0.13.4 — audit contradictoire BOAMP" \
            --notes-file docs/RELEASE_v0.13.4-clean.md
