name: Symfony SQLite demo
on:
  push:
    paths: ['apps/symfony/**', '.github/workflows/symfony-demo.yml', 'CHARTER.md', 'docs/translations/**']
  pull_request:
    paths: ['apps/symfony/**', '.github/workflows/symfony-demo.yml', 'CHARTER.md', 'docs/translations/**']
permissions:
  contents: read
jobs:
  native-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/symfony
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, openssl, tokenizer, mbstring, ctype, iconv, dom, xml, xmlwriter, simplexml, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer style:check
      - run: composer analyse
      - run: php tools/init-demo.php
      - run: php bin/console doctrine:migrations:migrate --no-interaction --env=demo
      - run: php bin/console app:demo:prepare --env=demo
      - run: php bin/console lint:twig templates --env=demo
      - run: php bin/console lint:yaml config --parse-tags
      - run: php bin/console doctrine:schema:validate --env=demo
      - name: Real HTTP smoke after install
        run: python3 tools/smoke_http.py
      - run: composer test
      - run: python3 tools/test_decp_pipeline_v8.py
      - run: python3 tools/test_decp_history_v8_1.py
      - run: python3 tools/test_decp_sql_inputs.py
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: python3 tools/test_decp_archive.py
  arch-install:
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        working-directory: apps/symfony
    steps:
      - name: Install Arch Linux official packages
        run: pacman -Syu --noconfirm --needed php php-sqlite composer git python unzip zstd ca-certificates
        working-directory: /
      - uses: actions/checkout@v4
      - name: Enable packaged PHP extensions for CI
        shell: bash
        run: |
          mkdir -p /etc/php/conf.d
          for ext in pdo_sqlite sqlite3 iconv mbstring dom simplexml xml curl; do
            if ! php -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' "$ext"; then
              if [[ -f "/usr/lib/php/modules/$ext.so" ]]; then
                printf 'extension=%s\n' "$ext" >> /etc/php/conf.d/populorum-ci.ini
              fi
            fi
          done
          php -m
      - name: Full install from composer.lock
        run: bash tools/install-arch.sh
      - name: Real HTTP smoke on fresh Arch installation
        run: python3 tools/smoke_http.py
      - name: Install from extracted GitHub-style source archive and test HTTP
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d /tmp/populorum-release-install-XXXXXX)"
          trap 'rm -rf "$root"' EXIT
          git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar --prefix=Populorum-release/ "$GITHUB_SHA" | tar -xf - -C "$root"
          cd "$root/Populorum-release/apps/symfony"
          test ! -e vendor/autoload.php
          bash tools/install-arch.sh
          test -f vendor/autoload.php
          python3 tools/smoke_http.py
      - name: Archive packaging and restore
        run: python3 tools/test_decp_archive.py
  release-installable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-demo, arch-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested source release (without national DECP files)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.6.1-arch"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no overwrite."
            exit 0
          fi
          mkdir -p release
          git archive --format=tar --prefix="Populorum-v0.6.1-arch/" "$GITHUB_SHA" | gzip -9 > release/Populorum-v0.6.1-arch.tar.gz
          (cd release && sha256sum Populorum-v0.6.1-arch.tar.gz > SHA256SUMS.txt)
          gh release create "$TAG" release/Populorum-v0.6.1-arch.tar.gz release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Populorum v0.6.1 — installation HTTP vérifiée sur Arch Linux" \
            --notes-file docs/RELEASE_NOTES_INSTALL.md
