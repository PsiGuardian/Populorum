# Exemple : domaine et configuration TLS propres à votre hébergement.
<VirtualHost *:443>
    ServerName VOTRE-DOMAINE
    DocumentRoot /CHEMIN/Populorum/apps/symfony/public
    SSLEngine on
    # SSLCertificateFile /CHEMIN/fullchain.pem
    # SSLCertificateKeyFile /CHEMIN/privkey.pem
    <Directory /CHEMIN/Populorum/apps/symfony/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    <FilesMatch "\.(sqlite|sqlite3|db|sql|env|pem|key)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
