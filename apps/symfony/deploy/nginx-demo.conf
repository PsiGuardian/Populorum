# Exemple pour un domaine dédié de démonstration, TLS à configurer sur le serveur.
server {
    listen 443 ssl;
    server_name VOTRE-DOMAINE;
    root /CHEMIN/Populorum/apps/symfony/public;
    index index.php;
    # ssl_certificate /CHEMIN/fullchain.pem;
    # ssl_certificate_key /CHEMIN/privkey.pem;
    location / { try_files $uri /index.php$is_args$args; }
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(sqlite|sqlite3|db|sql|env|pem|key)$ { deny all; }
}
