site_experiments:
    path: /experiences
    controller: App\Controller\DemoController::page
    defaults: { view: experiments }
    methods: [GET]
site_convergence:
    path: /convergence
    controller: App\Controller\DemoController::page
    defaults: { view: convergence }
    methods: [GET]
site_memory:
    path: /memoire
    controller: App\Controller\DemoController::page
    defaults: { view: memory }
    methods: [GET]
site_transparency:
    path: /transparence
    controller: App\Controller\DemoController::page
    defaults: { view: transparency }
    methods: [GET]
site_infrastructure:
    path: /infrastructure
    controller: App\Controller\DemoController::page
    defaults: { view: infrastructure }
    methods: [GET]
site_governance:
    path: /gouvernance
    controller: App\Controller\DemoController::page
