services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude: ['../src/Kernel.php','../src/Entity/','../src/DependencyInjection/','../src/DataCollector/']
    App\Service\DemoDatabase:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\CharterRepository:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Controller\DemoController:
        arguments:
            $projectDir: '%kernel.project_dir%'
    OmegaGuardian\ProfilerShield\Storage\FileStore: '@omega_guardian.store'
    OmegaGuardian\ProfilerShield\Security\Accounts: '@omega_guardian.accounts'
    OmegaGuardian\ProfilerShield\Security\Settings: '@omega_guardian.settings'

    App\Command\ReplicaCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\EventSubscriber\RequestProtectionSubscriber:
        arguments:
            $civicWritesLimiter: '@limiter.civic_writes'
            $searchReadsLimiter: '@limiter.search_reads'

    App\Service\PublicEvidence:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\PublicBudget:
        arguments:
            $projectDir: '%kernel.project_dir%'
